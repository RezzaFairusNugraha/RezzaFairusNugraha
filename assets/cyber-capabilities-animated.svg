<svg width="880" height="340" viewBox="0 0 880 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulseBorderRed { 0%, 100% { stroke-opacity: 0.4; filter: drop-shadow(0 0 2px #ff1e4244); } 50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px #ff1e4299); } }
      @keyframes pulseBorderWhite { 0%, 100% { stroke-opacity: 0.4; filter: drop-shadow(0 0 2px #ffffff44); } 50% { stroke-opacity: 1; filter: drop-shadow(0 0 7px #ffffff88); } }
      @keyframes cardFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
      @keyframes blinkDot { 0%, 100% { opacity: 0.9; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }

      .box-bg { fill: #0a060a; rx: 10px; stroke-width: 1.4; }
      .b-red { stroke: #ff1e42; animation: pulseBorderRed 3.2s infinite ease-in-out; }
      .b-white { stroke: #ffffff; animation: pulseBorderWhite 3.6s infinite ease-in-out; }
      .b-crimson { stroke: #ff3366; animation: pulseBorderRed 4.0s infinite ease-in-out; }

      .card-wrap { animation: cardFloat 4s infinite ease-in-out; }
      .p-dot { animation: blinkDot 1.8s infinite ease-in-out; }

      .cap-tag { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; letter-spacing: 1.2px; }
      .cap-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold; fill: #ffffff; }
      .cap-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .cap-bold { fill: #ffffff; font-weight: bold; }
      .cap-red { fill: #ff3366; font-weight: bold; }
    </style>
  </defs>

  <!-- ================= ROW 1 (2 WIDE TILES) ================= -->

  <!-- TILE 1: FULLSTACK -->
  <g transform="translate(8, 8)">
    <rect class="box-bg b-red" width="424" height="150"/>
    <circle class="p-dot" cx="24" cy="24" r="5" fill="#ff1e42"/>
    <text class="cap-tag" x="38" y="28" fill="#ff3366">01 // FULLSTACK DEVELOPMENT</text>
    
    <text class="cap-title" x="20" y="58">🚀 Scalable Fullstack Architecture</text>
    <text class="cap-desc" x="20" y="82">Crafting high-performance, responsive web systems from frontend</text>
    <text class="cap-desc" x="20" y="102">interfaces down to robust database backends and secure REST APIs.</text>
    
    <!-- Mini Tech Chips -->
    <rect x="20" y="118" width="58" height="20" rx="4" fill="#200a12" stroke="#ff1e42" stroke-width="0.8"/>
    <text x="49" y="132" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#ffffff">React</text>

    <rect x="84" y="118" width="66" height="20" rx="4" fill="#200a12" stroke="#ff1e42" stroke-width="0.8"/>
    <text x="117" y="132" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#ffffff">Next.js</text>

    <rect x="156" y="118" width="66" height="20" rx="4" fill="#200a12" stroke="#ff1e42" stroke-width="0.8"/>
    <text x="189" y="132" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#ffffff">Node.js</text>

    <rect x="228" y="118" width="66" height="20" rx="4" fill="#200a12" stroke="#ff1e42" stroke-width="0.8"/>
    <text x="261" y="132" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#ffffff">Express</text>

    <rect x="300" y="118" width="84" height="20" rx="4" fill="#200a12" stroke="#ff1e42" stroke-width="0.8"/>
    <text x="342" y="132" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#ffffff">PostgreSQL</text>
  </g>

  <!-- TILE 2: DEVSECOPS -->
  <g transform="translate(448, 8)">
    <rect class="box-bg b-white" width="424" height="150"/>
    <circle class="p-dot" cx="24" cy="24" r="5" fill="#ffffff"/>
    <text class="cap-tag" x="38" y="28" fill="#ffffff">02 // DEVSECOPS AUTOMATION</text>
    
    <text class="cap-title" x="20" y="58">🔐 Shift-Left Continuous Security</text>
    <text class="cap-desc" x="20" y="82">Integrating automated security verification into every commit: static</text>
    <text class="cap-desc" x="20" y="102">code analysis, dependency checking, and container vulnerability scans.</text>

    <!-- Mini Tech Chips -->
    <rect x="20" y="118" width="115" height="20" rx="4" fill="#181418" stroke="#ffffff" stroke-width="0.8"/>
    <text x="77" y="132" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#ffffff">SAST (SonarQube)</text>

    <rect x="142" y="118" width="125" height="20" rx="4" fill="#181418" stroke="#ffffff" stroke-width="0.8"/>
    <text x="204" y="132" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#ffffff">DAST (OWASP ZAP)</text>

    <rect x="274" y="118" width="95" height="20" rx="4" fill="#181418" stroke="#ffffff" stroke-width="0.8"/>
    <text x="321" y="132" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#ffffff">Trivy Scanning</text>
  </g>

  <!-- ================= ROW 2 (3 COMPACT TILES) ================= -->

  <!-- TILE 3: INFRASTRUCTURE -->
  <g transform="translate(8, 172)">
    <rect class="box-bg b-white" width="274" height="154"/>
    <circle class="p-dot" cx="22" cy="22" r="4.5" fill="#ffffff"/>
    <text class="cap-tag" x="34" y="26" fill="#ffffff">03 // INFRASTRUCTURE</text>
    
    <text class="cap-title" x="18" y="52">☁️ Cloud &amp; Containers</text>
    <text class="cap-desc" x="18" y="74">Container orchestration and</text>
    <text class="cap-desc" x="18" y="92">Infrastructure as Code (IaC) with</text>
    <text class="cap-desc" x="18" y="110"><tspan class="cap-bold">Docker, K8s, Linux &amp; Terraform</tspan>.</text>
    
    <rect x="18" y="126" width="105" height="18" rx="4" fill="#181418" stroke="#ffffff" stroke-width="0.8"/>
    <text x="70" y="139" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8.5" font-weight="bold" fill="#ffffff">Orchestrated 🐳</text>
  </g>

  <!-- TILE 4: CYBERSECURITY -->
  <g transform="translate(298, 172)">
    <rect class="box-bg b-red" width="274" height="154"/>
    <circle class="p-dot" cx="22" cy="22" r="4.5" fill="#ff1e42"/>
    <text class="cap-tag" x="34" y="26" fill="#ff3366">04 // CYBERSECURITY</text>
    
    <text class="cap-title" x="18" y="52">🛡️ Pentesting &amp; CTFs</text>
    <text class="cap-desc" x="18" y="74">Offensive &amp; defensive security,</text>
    <text class="cap-desc" x="18" y="92">web application vulnerabilities,</text>
    <text class="cap-desc" x="18" y="110"><tspan class="cap-red">Burp Suite &amp; OWASP Top 10</tspan>.</text>

    <rect x="18" y="126" width="105" height="18" rx="4" fill="#200a12" stroke="#ff1e42" stroke-width="0.8"/>
    <text x="70" y="139" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8.5" font-weight="bold" fill="#ff3366">Defended 🔐</text>
  </g>

  <!-- TILE 5: TIMELINE & METRIC -->
  <g transform="translate(588, 172)">
    <rect class="box-bg b-crimson" width="284" height="154"/>
    <circle class="p-dot" cx="22" cy="22" r="4.5" fill="#ff3366"/>
    <text class="cap-tag" x="34" y="26" fill="#ff3366">05 // ACTIVE TIMELINE</text>
    
    <text class="cap-title" x="18" y="52">✨ Creating &amp; Securing</text>
    <text class="cap-desc" x="18" y="74">Creating bugs since <tspan class="cap-bold">2022</tspan> —</text>
    <text class="cap-desc" x="18" y="92">and actively hunting, fixing,</text>
    <text class="cap-desc" x="18" y="110">and patching them ever since!</text>

    <rect x="18" y="126" width="125" height="18" rx="4" fill="#200a12" stroke="#ff3366" stroke-width="0.8"/>
    <text x="80" y="139" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8.5" font-weight="bold" fill="#ff3366">Since 2022 • Active ⚡</text>
  </g>
</svg>
