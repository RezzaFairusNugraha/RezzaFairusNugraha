<svg width="880" height="190" viewBox="0 0 880 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="manifestoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14080e"/>
      <stop offset="50%" stop-color="#0a0508"/>
      <stop offset="100%" stop-color="#180b12"/>
    </linearGradient>

    <linearGradient id="borderRedWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e42"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff1e42"/>
    </linearGradient>

    <style>
      @keyframes borderBlink { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 0.95; } }
      @keyframes hudScan { 0% { transform: translateY(0px); opacity: 0; } 30% { opacity: 0.35; } 70% { opacity: 0.35; } 100% { transform: translateY(180px); opacity: 0; } }
      @keyframes redBeacon { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }

      .card-frame { fill: url(#manifestoGrad); stroke: url(#borderRedWhite); stroke-width: 1.5; rx: 12px; animation: borderBlink 3.5s infinite ease-in-out; }
      .scan-beam { animation: hudScan 4s ease-in-out infinite; }
      .beacon { transform-origin: 32px 30px; animation: redBeacon 1.8s infinite ease-in-out; }

      .hud-title { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 700; fill: #ff3366; letter-spacing: 2px; }
      .hud-sub { font-family: 'Fira Code', monospace; font-size: 9.5px; fill: #94a3b8; }
      .manifesto-lead { font-family: 'Segoe UI', -apple-system, Arial, sans-serif; font-size: 14.5px; font-weight: 600; fill: #f8fafc; }
      .manifesto-body { font-family: 'Segoe UI', -apple-system, Arial, sans-serif; font-size: 13.5px; fill: #cbd5e1; }
      .highlight-red { fill: #ff3366; font-weight: 700; }
      .highlight-white { fill: #ffffff; font-weight: 700; }
      .pill-txt { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; fill: #ffffff; }
    </style>
  </defs>

  <!-- Outer Card with Glowing Border -->
  <rect class="card-frame" x="4" y="4" width="872" height="182"/>

  <!-- Scanning Holographic Beam -->
  <line class="scan-beam" x1="10" y1="10" x2="870" y2="10" stroke="#ff3366" stroke-width="1.2"/>

  <!-- Corner Tech HUD Accents -->
  <path d="M 4,24 L 4,4 L 24,4" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M 876,24 L 876,4 L 856,4" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M 4,166 L 4,186 L 24,186" fill="none" stroke="#ff1e42" stroke-width="2.5"/>
  <path d="M 876,166 L 876,186 L 856,186" fill="none" stroke="#ff1e42" stroke-width="2.5"/>

  <!-- Top Status Bar -->
  <circle class="beacon" cx="32" cy="30" r="5" fill="#ff1e42"/>
  <text class="hud-title" x="48" y="34">SECURITY PHILOSOPHY // CORE MANIFESTO</text>

  <!-- Right Pill: Zero Trust Architecture -->
  <rect x="686" y="21" width="168" height="20" rx="10" fill="#360a14" stroke="#ff1e42" stroke-width="1.2"/>
  <circle cx="698" cy="31" r="3" fill="#ffffff"/>
  <text class="pill-txt" x="774" y="34.5" text-anchor="middle">ZERO-TRUST SEC OPS</text>

  <!-- Horizontal Divider Line -->
  <line x1="28" y1="48" x2="852" y2="48" stroke="#331420" stroke-width="1"/>

  <!-- The Manifesto Text Rendered in High-End Visual Typography -->
  <text class="manifesto-lead" x="28" y="76">
    I am a developer and security engineer who bridges the gap between 
    <tspan class="highlight-red">rapid fullstack development</tspan> and 
    <tspan class="highlight-white">bulletproof software security</tspan>.
  </text>

  <text class="manifesto-body" x="28" y="104">
    I believe security isn't an afterthought or a blocker; it is a 
    <tspan class="highlight-white">fundamental engineering requirement</tspan>.
  </text>

  <text class="manifesto-body" x="28" y="130">
    Whether architecting cloud backends, auditing codebases, scanning container images, or participating in CTFs,
  </text>

  <text class="manifesto-body" x="28" y="156">
    my relentless focus is on 
    <tspan class="highlight-red">continuous improvement</tspan> and 
    <tspan class="highlight-white">resilient, tamper-resistant engineering 🛡️</tspan>
  </text>
</svg>
