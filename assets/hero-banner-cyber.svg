<svg width="900" height="295" viewBox="0 0 900 295" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Custom Cyber Wave Clip -->
    <clipPath id="cyberWave">
      <path d="M 0,24 Q 0,0 24,0 L 876,0 Q 900,0 900,24 L 900,240 C 760,280 620,210 450,250 C 290,290 140,220 0,260 Z"/>
    </clipPath>

    <!-- Deep Obsidian Red-Cyber Background Gradient -->
    <linearGradient id="bgRedCyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b080d"/>
      <stop offset="50%" stop-color="#140910"/>
      <stop offset="85%" stop-color="#1a0b12"/>
      <stop offset="100%" stop-color="#080709"/>
    </linearGradient>

    <!-- Merah Putih (Crimson Red & Crisp White) Name Gradient -->
    <linearGradient id="merahPutihName" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ff3b5c"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff1a40"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Liquid Merah Putih Waves -->
    <linearGradient id="redWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff1e42" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="redWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ff3366" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="redWhiteAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e42"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff1e42"/>
    </linearGradient>

    <!-- Glowing Red & White Filter -->
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatTerm {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes rotateRadar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseTermRed {
        0%, 100% { stroke-opacity: 0.5; filter: drop-shadow(0 0 3px #ff1e4255); }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 10px #ff1e42aa); }
      }
      @keyframes blinkTermCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanbeamRed {
        0% { transform: translateY(-10px); opacity: 0; }
        25% { opacity: 0.5; }
        75% { opacity: 0.5; }
        100% { transform: translateY(185px); opacity: 0; }
      }
      @keyframes eqRed1 { 0%, 100% { height: 10px; y: 202px; } 50% { height: 26px; y: 186px; } }
      @keyframes eqRed2 { 0%, 100% { height: 24px; y: 188px; } 50% { height: 8px; y: 204px; } }
      @keyframes eqRed3 { 0%, 100% { height: 16px; y: 196px; } 50% { height: 28px; y: 184px; } }
      @keyframes eqRed4 { 0%, 100% { height: 28px; y: 184px; } 50% { height: 12px; y: 200px; } }
      @keyframes eqRed5 { 0%, 100% { height: 14px; y: 198px; } 50% { height: 24px; y: 188px; } }
      @keyframes meteorTrail {
        0% { transform: translate(0, 0); opacity: 0; }
        15% { opacity: 0.9; }
        60% { transform: translate(-260px, 130px); opacity: 0; }
        100% { transform: translate(-260px, 130px); opacity: 0; }
      }

      .term-box { animation: floatTerm 4.5s ease-in-out infinite; }
      .radar-spin { transform-origin: 64px 64px; animation: rotateRadar 12s linear infinite; }
      .radar-rev { transform-origin: 64px 64px; animation: rotateRadar 18s linear infinite reverse; }
      .term-cursor { animation: blinkTermCursor 0.85s infinite; }
      .scanline-red { animation: scanbeamRed 3.8s ease-in-out infinite; }
      .eq-r1 { animation: eqRed1 1.0s ease-in-out infinite; }
      .eq-r2 { animation: eqRed2 0.8s ease-in-out infinite; }
      .eq-r3 { animation: eqRed3 1.2s ease-in-out infinite; }
      .eq-r4 { animation: eqRed4 0.9s ease-in-out infinite; }
      .eq-r5 { animation: eqRed5 1.1s ease-in-out infinite; }
      .m-trail1 { animation: meteorTrail 4.5s linear infinite; }
      .m-trail2 { animation: meteorTrail 6.5s linear infinite 2s; }

      .greet-red { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 700; fill: #ff3366; letter-spacing: 2px; }
      .hero-name { font-family: 'Segoe UI', -apple-system, Arial, sans-serif; font-size: 38px; font-weight: 900; fill: url(#merahPutihName); filter: drop-shadow(0 2px 10px rgba(255,30,66,0.35)); }
      .hero-roles { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #f8fafc; }
      .badge-txt { font-family: 'Fira Code', monospace; font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .t-prompt { font-family: 'Fira Code', monospace; font-size: 11px; fill: #ff3366; }
      .t-cmd { font-family: 'Fira Code', monospace; font-size: 11px; fill: #ffffff; font-weight: bold; }
      .t-out { font-family: 'Fira Code', monospace; font-size: 11px; fill: #cbd5e1; }
      .t-accent { fill: #ff6b81; font-weight: bold; }
      .t-white { fill: #ffffff; font-weight: bold; }
      .t-pass { fill: #4ade80; font-weight: bold; }
    </style>
  </defs>

  <!-- Main Body with Cyber Wave Clip -->
  <g clip-path="url(#cyberWave)">
    <rect width="900" height="295" fill="url(#bgRedCyber)"/>

    <!-- Subtle Red Cyber Matrix Grid Background -->
    <g opacity="0.08" stroke="#ff1e42" stroke-width="1">
      <line x1="0" y1="40" x2="900" y2="40"/>
      <line x1="0" y1="80" x2="900" y2="80"/>
      <line x1="0" y1="120" x2="900" y2="120"/>
      <line x1="0" y1="160" x2="900" y2="160"/>
      <line x1="0" y1="200" x2="900" y2="200"/>
      <line x1="100" y1="0" x2="100" y2="295"/>
      <line x1="200" y1="0" x2="200" y2="295"/>
      <line x1="300" y1="0" x2="300" y2="295"/>
      <line x1="400" y1="0" x2="400" y2="295"/>
      <line x1="500" y1="0" x2="500" y2="295"/>
      <line x1="600" y1="0" x2="600" y2="295"/>
      <line x1="700" y1="0" x2="700" y2="295"/>
      <line x1="800" y1="0" x2="800" y2="295"/>
    </g>

    <!-- Ambient Glowing Orbs -->
    <circle cx="120" cy="90" r="160" fill="#ff1e42" opacity="0.12" filter="url(#glowRed)"/>
    <circle cx="720" cy="120" r="190" fill="#ffffff" opacity="0.06"/>
    <circle cx="430" cy="230" r="130" fill="#ff3366" opacity="0.09"/>

    <!-- Red & White Meteors -->
    <line class="m-trail1" x1="460" y1="10" x2="510" y2="-12" stroke="#ff3366" stroke-width="2" stroke-linecap="round"/>
    <line class="m-trail2" x1="800" y1="20" x2="850" y2="-2" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Liquid Merah Putih Waves at Bottom -->
    <g opacity="0.95">
      <path d="M -900,220 Q -675,185 -450,220 T 0,220 T 450,220 T 900,220 T 1350,220 L 1350,295 L -900,295 Z" fill="url(#redWave1)">
        <animateTransform attributeName="transform" type="translate" from="0,0" to="900,0" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M -900,232 Q -675,265 -450,232 T 0,232 T 450,232 T 900,232 T 1350,232 L 1350,295 L -900,295 Z" fill="url(#redWave2)">
        <animateTransform attributeName="transform" type="translate" from="900,0" to="0,0" dur="7.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ================= LEFT SIDE: MERAH PUTIH CYBER IDENTITY ================= -->
    <!-- Rotating Cyber Reticle (Merah Putih) -->
    <g class="radar-spin">
      <circle cx="64" cy="64" r="28" fill="none" stroke="#ff1e42" stroke-width="1.8" stroke-dasharray="14 8 4 8" opacity="0.9"/>
      <circle cx="64" cy="64" r="21" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.8"/>
    </g>
    <g class="radar-rev">
      <polygon points="64,40 85,52 85,76 64,88 43,76 43,52" fill="none" stroke="#ff4757" stroke-width="1.4" stroke-dasharray="8 6"/>
    </g>
    <!-- Center Red Shield Emblem -->
    <circle cx="64" cy="64" r="16" fill="#14070c" stroke="#ff1e42" stroke-width="2"/>
    <path d="M 64,54 L 71,57 L 71,65 C 71,70 67,73 64,74 C 61,73 57,70 57,65 L 57,57 Z" fill="#ff1e42"/>
    <!-- White Inner Core of Shield -->
    <path d="M 64,56 L 69,58 L 69,64 C 69,68 66,70 64,71 C 62,70 59,68 59,64 L 59,58 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="64" cy="63" r="2" fill="#ff1e42"/>

    <!-- Status Flag & Greeting Tag -->
    <text class="greet-red" x="106" y="58">🇮🇩 INDONESIAN CYBER DEFENSE // ACTIVE</text>
    <rect x="106" y="66" width="160" height="2.5" rx="1.2" fill="url(#redWhiteAccent)"/>

    <!-- Left-Aligned Giant Bold Name -->
    <text class="hero-name" x="38" y="125">Rezza Fairus Nugraha</text>

    <!-- Roles & Specialization Subtitle -->
    <text class="hero-roles" x="40" y="154">
      <tspan fill="#ff3366">Fullstack Developer</tspan>
      <tspan fill="#64748b"> • </tspan>
      <tspan fill="#ffffff">DevSecOps Engineer</tspan>
      <tspan fill="#64748b"> • </tspan>
      <tspan fill="#ff6b81">Cybersecurity Specialist</tspan>
    </text>

    <!-- Animated Red & White Equalizer Bars -->
    <rect class="eq-r1" x="40" y="202" width="4" height="10" rx="2" fill="#ff1e42"/>
    <rect class="eq-r2" x="47" y="188" width="4" height="24" rx="2" fill="#ffffff"/>
    <rect class="eq-r3" x="54" y="196" width="4" height="16" rx="2" fill="#ff3366"/>
    <rect class="eq-r4" x="61" y="184" width="4" height="28" rx="2" fill="#f8fafc"/>
    <rect class="eq-r5" x="68" y="198" width="4" height="14" rx="2" fill="#ff4757"/>

    <!-- Slanted Cyber Badge 1: Red Team / DevSecOps -->
    <polygon points="86,182 232,182 222,210 76,210" fill="#180b11" stroke="#ff1e42" stroke-width="1.3"/>
    <text class="badge-txt" x="154" y="200" text-anchor="middle">🛡️ SHIFT-LEFT DEFENSE</text>

    <!-- Slanted Cyber Badge 2: Location (Merah Putih) -->
    <polygon points="242,182 400,182 390,210 232,210" fill="#180b11" stroke="#ffffff" stroke-width="1.3"/>
    <text class="badge-txt" x="316" y="200" text-anchor="middle">🇮🇩 WEST JAVA, ID</text>

    <!-- ================= RIGHT SIDE: RED-WHITE SECOPS TERMINAL ================= -->
    <g class="term-box">
      <!-- Terminal Glow & Body -->
      <rect x="496" y="24" width="374" height="190" rx="10" fill="#040306" opacity="0.75"/>
      <rect x="490" y="18" width="374" height="190" rx="10" fill="#0d080e" stroke="#2a121d" stroke-width="1.6" style="animation: pulseTermRed 3.5s infinite ease-in-out;"/>

      <!-- Terminal Top Bar -->
      <path d="M 490,28 Q 490,18 500,18 L 854,18 Q 864,18 864,28 L 864,46 L 490,46 Z" fill="#1a0c14"/>
      <!-- Window Controls -->
      <circle cx="508" cy="32" r="5" fill="#ff1e42"/>
      <circle cx="524" cy="32" r="5" fill="#eab308"/>
      <circle cx="540" cy="32" r="5" fill="#10b981"/>
      <text x="670" y="35" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#e2e8f0">rezza@redteam-secops: ~/pipeline</text>

      <!-- Active Defense Badge in Terminal -->
      <rect x="784" y="24" width="70" height="16" rx="8" fill="#3b0813" stroke="#ff1e42" stroke-width="1"/>
      <circle cx="794" cy="32" r="3" fill="#ff1e42"/>
      <text x="826" y="35" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8.5" font-weight="bold" fill="#ffffff">ENFORCED</text>

      <!-- Terminal Scanning Beam (Red) -->
      <line class="scanline-red" x1="492" y1="46" x2="862" y2="46" stroke="#ff1e42" stroke-width="1.4" opacity="0.4"/>

      <!-- Terminal Content -->
      <g transform="translate(506, 68)">
        <text class="t-prompt" x="0" y="0">┌──(rezza㉿redteam)-[~]</text>
        <text class="t-prompt" x="0" y="18">└─$ <tspan class="t-cmd">./run-security-pipeline.sh</tspan></text>

        <!-- Command Outputs -->
        <text class="t-out" x="0" y="40">
          <tspan class="t-accent">[+] SAST (SonarQube):</tspan> <tspan class="t-pass">Clean (0 Vulns)</tspan>
        </text>
        <text class="t-out" x="0" y="58">
          <tspan class="t-accent">[+] Dependencies (Snyk):</tspan> <tspan class="t-white">Audited &amp; Patched</tspan>
        </text>
        <text class="t-out" x="0" y="76">
          <tspan class="t-accent">[+] Container (Trivy):</tspan> <tspan class="t-white">Image Hardened 🛡️</tspan>
        </text>
        <text class="t-out" x="0" y="94">
          <tspan class="t-accent">[+] Deployment (K8s):</tspan> <tspan class="t-pass">Production Secure 🚀</tspan>
        </text>

        <text class="t-prompt" x="0" y="118">└─$ <tspan fill="#ffffff">echo $MOTTO</tspan></text>
        <text class="t-out" x="110" y="118"><tspan fill="#ff3b5c">"Build Fast, Ship Safe"</tspan></text>
        <rect class="term-cursor" x="256" y="107" width="7" height="13" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- Glowing Merah Putih Bottom Border Wave -->
  <path d="M 0,260 C 140,220 290,290 450,250 C 620,210 760,280 900,240" fill="none" stroke="url(#redWhiteAccent)" stroke-width="3.5" filter="url(#glowRed)"/>
</svg>
