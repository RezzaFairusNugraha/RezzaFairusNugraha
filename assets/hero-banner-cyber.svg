<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Wave Clip Path -->
    <clipPath id="cyberWave">
      <path d="M 0,24 Q 0,0 24,0 L 876,0 Q 900,0 900,24 L 900,230 C 760,268 620,200 450,238 C 290,276 140,208 0,248 Z"/>
    </clipPath>

    <!-- Deep Cyber Slate Background Gradient -->
    <linearGradient id="bgCyberDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="45%" stop-color="#090e1a"/>
      <stop offset="80%" stop-color="#0d1124"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>

    <!-- Tokyo Night / Cyberpunk Name Gradient: Emerald to Cyan to Violet -->
    <linearGradient id="cyberNameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="45%" stop-color="#00f2fe"/>
      <stop offset="80%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#00ff9d"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Waves: Neon Green, Cyan & Violet -->
    <linearGradient id="waveCyanGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="waveVioletCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00ff9d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <style>
      @keyframes floatWindow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
      @keyframes rotateReticle { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes blinkCursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes scanbeam { 0% { transform: translateY(0px); opacity: 0; } 30% { opacity: 0.35; } 70% { opacity: 0.35; } 100% { transform: translateY(160px); opacity: 0; } }
      @keyframes eq1 { 0%, 100% { height: 8px; y: 192px; } 50% { height: 22px; y: 178px; } }
      @keyframes eq2 { 0%, 100% { height: 20px; y: 180px; } 50% { height: 7px; y: 193px; } }
      @keyframes eq3 { 0%, 100% { height: 12px; y: 188px; } 50% { height: 25px; y: 175px; } }
      @keyframes eq4 { 0%, 100% { height: 22px; y: 178px; } 50% { height: 10px; y: 190px; } }
      @keyframes eq5 { 0%, 100% { height: 14px; y: 186px; } 50% { height: 21px; y: 179px; } }

      .term-box { animation: floatWindow 4.2s ease-in-out infinite; }
      .reticle-spin { transform-origin: 62px 62px; animation: rotateReticle 14s linear infinite; }
      .cursor-blink { animation: blinkCursor 0.9s infinite; }
      .beam-sweep { animation: scanbeam 3.5s ease-in-out infinite; }
      .eq-b1 { animation: eq1 1.1s ease-in-out infinite; }
      .eq-b2 { animation: eq2 0.9s ease-in-out infinite; }
      .eq-b3 { animation: eq3 1.3s ease-in-out infinite; }
      .eq-b4 { animation: eq4 1.0s ease-in-out infinite; }
      .eq-b5 { animation: eq5 1.2s ease-in-out infinite; }

      .tag-top { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 700; fill: #00ff9d; letter-spacing: 2px; }
      .hero-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; font-size: 38px; font-weight: 900; fill: url(#cyberNameGrad); }
      .hero-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #cbd5e1; }
      .chip-label { font-family: 'Fira Code', monospace; font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .t-prm { font-family: 'Fira Code', monospace; font-size: 11px; fill: #00ff9d; }
      .t-cmd { font-family: 'Fira Code', monospace; font-size: 11px; fill: #f8fafc; font-weight: bold; }
      .t-out { font-family: 'Fira Code', monospace; font-size: 11px; fill: #94a3b8; }
      .t-pass { fill: #00ff9d; font-weight: bold; }
      .t-cyan { fill: #00f2fe; }
      .t-violet { fill: #a78bfa; font-weight: bold; }
    </style>
  </defs>

  <g clip-path="url(#cyberWave)">
    <rect width="900" height="280" fill="url(#bgCyberDev)"/>

    <!-- Subtle Ambient Glow Orbs -->
    <circle cx="130" cy="80" r="160" fill="#00ff9d" opacity="0.08"/>
    <circle cx="720" cy="110" r="180" fill="#00f2fe" opacity="0.08"/>
    <circle cx="480" cy="220" r="140" fill="#8b5cf6" opacity="0.08"/>

    <!-- Flowing Wave Gradients -->
    <g opacity="0.9">
      <path d="M -900,210 Q -675,175 -450,210 T 0,210 T 450,210 T 900,210 T 1350,210 L 1350,280 L -900,280 Z" fill="url(#waveCyanGreen)">
        <animateTransform attributeName="transform" type="translate" from="0,0" to="900,0" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M -900,222 Q -675,255 -450,222 T 0,222 T 450,222 T 900,222 T 1350,222 L 1350,280 L -900,280 Z" fill="url(#waveVioletCyan)">
        <animateTransform attributeName="transform" type="translate" from="900,0" to="0,0" dur="8.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ================= LEFT SIDE ================= -->
    <!-- Rotating Cyber Reticle -->
    <g class="reticle-spin">
      <circle cx="62" cy="62" r="26" fill="none" stroke="#00ff9d" stroke-width="1.6" stroke-dasharray="12 6" opacity="0.9"/>
      <circle cx="62" cy="62" r="19" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.8"/>
    </g>
    <circle cx="62" cy="62" r="14" fill="#0a1020" stroke="#8b5cf6" stroke-width="1.5"/>
    <path d="M 62,54 L 68,56.5 L 68,63 C 68,67 65,69.5 62,70.5 C 59,69.5 56,67 56,63 L 56,56.5 Z" fill="#00ff9d"/>
    <circle cx="62" cy="61.5" r="1.8" fill="#050811"/>

    <!-- Greeting Tag -->
    <text class="tag-top" x="102" y="56">FULLSTACK • DEVSECOPS • CYBERSECURITY</text>
    <rect x="102" y="64" width="225" height="2.5" rx="1.2" fill="url(#borderGrad)"/>

    <!-- Hero Name -->
    <text class="hero-title" x="38" y="120">Rezza Fairus Nugraha</text>

    <!-- Subtitle Roles -->
    <text class="hero-sub" x="40" y="148">
      <tspan fill="#00ff9d">Fullstack Developer</tspan>
      <tspan fill="#475569"> • </tspan>
      <tspan fill="#00f2fe">DevSecOps Engineer</tspan>
      <tspan fill="#475569"> • </tspan>
      <tspan fill="#a78bfa">Cybersecurity Specialist</tspan>
    </text>

    <!-- Dynamic Equalizer Bars -->
    <rect class="eq-b1" x="40" y="192" width="4" height="8" rx="2" fill="#00ff9d"/>
    <rect class="eq-b2" x="47" y="180" width="4" height="20" rx="2" fill="#00f2fe"/>
    <rect class="eq-b3" x="54" y="188" width="4" height="12" rx="2" fill="#8b5cf6"/>
    <rect class="eq-b4" x="61" y="178" width="4" height="22" rx="2" fill="#38bdf8"/>
    <rect class="eq-b5" x="68" y="186" width="4" height="14" rx="2" fill="#00ff9d"/>

    <!-- Slanted Tag 1 -->
    <polygon points="86,176 226,176 216,204 76,204" fill="#0b1326" stroke="#00ff9d" stroke-width="1.2"/>
    <text class="chip-label" x="151" y="194" text-anchor="middle">🛡️ SHIFT-LEFT SEC</text>

    <!-- Slanted Tag 2 -->
    <polygon points="236,176 385,176 375,204 226,204" fill="#110d24" stroke="#8b5cf6" stroke-width="1.2"/>
    <text class="chip-label" x="305" y="194" text-anchor="middle">⚡ CONTINUOUS SEC</text>

    <!-- ================= RIGHT SIDE: TERMINAL WINDOW ================= -->
    <g class="term-box">
      <rect x="502" y="24" width="368" height="182" rx="10" fill="#03060a" opacity="0.6"/>
      <rect x="496" y="18" width="368" height="182" rx="10" fill="#090e1c" stroke="#1e293b" stroke-width="1.4"/>

      <!-- Top Bar -->
      <path d="M 496,28 Q 496,18 506,18 L 854,18 Q 864,18 864,28 L 864,46 L 496,46 Z" fill="#0f172a"/>
      <circle cx="514" cy="32" r="5" fill="#ef4444"/>
      <circle cx="530" cy="32" r="5" fill="#f59e0b"/>
      <circle cx="546" cy="32" r="5" fill="#10b981"/>
      <text x="675" y="35" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">rezza@secops-pipeline:~</text>

      <rect x="786" y="24" width="68" height="16" rx="8" fill="#052e16" stroke="#00ff9d" stroke-width="1"/>
      <circle cx="796" cy="32" r="3" fill="#00ff9d"/>
      <text x="826" y="35" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8.5" font-weight="bold" fill="#86efac">PROTECTED</text>

      <!-- Laser Beam -->
      <line class="beam-sweep" x1="498" y1="46" x2="862" y2="46" stroke="#00f2fe" stroke-width="1.2"/>

      <!-- Terminal Lines -->
      <g transform="translate(512, 68)">
        <text class="t-prm" x="0" y="0">┌──(rezza㉿secops)-[~]</text>
        <text class="t-prm" x="0" y="18">└─$ <tspan class="t-cmd">./run-security-pipeline.sh</tspan></text>

        <text class="t-out" x="0" y="40">
          <tspan class="t-cyan">[+] SAST (SonarQube):</tspan> <tspan class="t-pass">Clean (0 Vulns)</tspan>
        </text>
        <text class="t-out" x="0" y="58">
          <tspan class="t-cyan">[+] Container (Trivy):</tspan> <tspan fill="#f8fafc">Hardened &amp; Scanned</tspan>
        </text>
        <text class="t-out" x="0" y="76">
          <tspan class="t-cyan">[+] Deploy (K8s):</tspan> <tspan class="t-pass">Production Ready 🚀</tspan>
        </text>
        <text class="t-out" x="0" y="94">
          <tspan class="t-violet">[+] DAST (OWASP):</tspan> <tspan fill="#f8fafc">Audit Verified</tspan>
        </text>

        <text class="t-prm" x="0" y="116">└─$ <tspan fill="#f8fafc">status</tspan> → <tspan fill="#00ff9d">"Build fast, ship safe"</tspan></text>
        <rect class="cursor-blink" x="254" y="105" width="7" height="13" fill="#00ff9d"/>
      </g>
    </g>
  </g>

  <!-- Glowing Wave Border -->
  <path d="M 0,248 C 140,208 290,276 450,238 C 620,200 760,268 900,230" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>
</svg>
