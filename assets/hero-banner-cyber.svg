<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Wave Clip -->
    <clipPath id="cyberWave">
      <path d="M 0,24 Q 0,0 24,0 L 876,0 Q 900,0 900,24 L 900,230 C 760,268 620,200 450,238 C 290,276 140,208 0,248 Z"/>
    </clipPath>

    <!-- Deep Modern Dark Background Gradient -->
    <linearGradient id="bgDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0d111c"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Blend of Neon Green, Cyan, and Crisp Red-White Accent -->
    <linearGradient id="heroTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00ff9d"/>
      <stop offset="70%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ff3366"/>
      <animate attributeName="x1" values="0%;50%;0%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Flowing Wave Gradients -->
    <linearGradient id="waveEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff1e42" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="waveRedWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="40%" stop-color="#00f2fe"/>
      <stop offset="70%" stop-color="#ff1e42"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <style>
      @keyframes floatWindow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
      @keyframes rotateEmblem { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes blinkCursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes scanbeam { 0% { transform: translateY(0px); opacity: 0; } 30% { opacity: 0.35; } 70% { opacity: 0.35; } 100% { transform: translateY(160px); opacity: 0; } }
      @keyframes eq1 { 0%, 100% { height: 8px; y: 192px; } 50% { height: 22px; y: 178px; } }
      @keyframes eq2 { 0%, 100% { height: 20px; y: 180px; } 50% { height: 7px; y: 193px; } }
      @keyframes eq3 { 0%, 100% { height: 12px; y: 188px; } 50% { height: 24px; y: 176px; } }
      @keyframes eq4 { 0%, 100% { height: 22px; y: 178px; } 50% { height: 10px; y: 190px; } }
      @keyframes eq5 { 0%, 100% { height: 14px; y: 186px; } 50% { height: 20px; y: 180px; } }

      .term-float { animation: floatWindow 4s ease-in-out infinite; }
      .emblem-spin { transform-origin: 62px 62px; animation: rotateEmblem 16s linear infinite; }
      .term-cursor { animation: blinkCursor 0.9s infinite; }
      .beam-line { animation: scanbeam 3.5s ease-in-out infinite; }
      .e1 { animation: eq1 1.1s ease-in-out infinite; }
      .e2 { animation: eq2 0.9s ease-in-out infinite; }
      .e3 { animation: eq3 1.3s ease-in-out infinite; }
      .e4 { animation: eq4 1.0s ease-in-out infinite; }
      .e5 { animation: eq5 1.2s ease-in-out infinite; }

      .tag-hello { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 700; fill: #00ff9d; letter-spacing: 2px; }
      .hero-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; font-size: 38px; font-weight: 900; fill: url(#heroTitleGrad); }
      .hero-roles { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #e2e8f0; }
      .pill-text { font-family: 'Fira Code', monospace; font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .t-prm { font-family: 'Fira Code', monospace; font-size: 11px; fill: #00ff9d; }
      .t-white { font-family: 'Fira Code', monospace; font-size: 11px; fill: #f8fafc; font-weight: bold; }
      .t-txt { font-family: 'Fira Code', monospace; font-size: 11px; fill: #94a3b8; }
      .t-green { fill: #00ff9d; font-weight: bold; }
      .t-red { fill: #ff4757; font-weight: bold; }
      .t-cyan { fill: #00f2fe; }
    </style>
  </defs>

  <g clip-path="url(#cyberWave)">
    <rect width="900" height="280" fill="url(#bgDev)"/>

    <!-- Subtle Ambient Glow Orbs -->
    <circle cx="130" cy="80" r="150" fill="#00ff9d" opacity="0.08"/>
    <circle cx="720" cy="110" r="170" fill="#00f2fe" opacity="0.07"/>
    <circle cx="480" cy="220" r="140" fill="#ff1e42" opacity="0.06"/>

    <!-- Bottom Liquid Waves -->
    <g opacity="0.85">
      <path d="M -900,210 Q -675,175 -450,210 T 0,210 T 450,210 T 900,210 T 1350,210 L 1350,280 L -900,280 Z" fill="url(#waveEmerald)">
        <animateTransform attributeName="transform" type="translate" from="0,0" to="900,0" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M -900,222 Q -675,255 -450,222 T 0,222 T 450,222 T 900,222 T 1350,222 L 1350,280 L -900,280 Z" fill="url(#waveRedWhite)">
        <animateTransform attributeName="transform" type="translate" from="900,0" to="0,0" dur="8.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ================= LEFT: HERO IDENTITY ================= -->
    <!-- Rotating Hexagon Emblem -->
    <g class="emblem-spin">
      <circle cx="62" cy="62" r="26" fill="none" stroke="#00ff9d" stroke-width="1.6" stroke-dasharray="12 6" opacity="0.85"/>
      <circle cx="62" cy="62" r="19" fill="none" stroke="#ff1e42" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.75"/>
    </g>
    <circle cx="62" cy="62" r="14" fill="#0d1424" stroke="#00f2fe" stroke-width="1.5"/>
    <!-- Center Shield Icon -->
    <path d="M 62,54 L 68,56.5 L 68,63 C 68,67 65,69.5 62,70.5 C 59,69.5 56,67 56,63 L 56,56.5 Z" fill="#00ff9d"/>
    <circle cx="62" cy="61.5" r="1.8" fill="#090d16"/>

    <!-- Greeting & Status -->
    <text class="tag-hello" x="102" y="56">⚡ FULLSTACK &amp; DEVSECOPS</text>
    <rect x="102" y="64" width="135" height="2.5" rx="1.2" fill="url(#accentBorder)"/>

    <!-- Bold Name -->
    <text class="hero-title" x="38" y="120">Rezza Fairus Nugraha</text>

    <!-- Subtitle Roles -->
    <text class="hero-roles" x="40" y="148">
      <tspan fill="#00ff9d">Fullstack Developer</tspan>
      <tspan fill="#64748b"> • </tspan>
      <tspan fill="#00f2fe">DevSecOps Engineer</tspan>
      <tspan fill="#64748b"> • </tspan>
      <tspan fill="#ff3366">Cybersecurity</tspan>
    </text>

    <!-- Dynamic Equalizer Bars -->
    <rect class="e1" x="40" y="192" width="4" height="8" rx="2" fill="#00ff9d"/>
    <rect class="e2" x="47" y="180" width="4" height="20" rx="2" fill="#00f2fe"/>
    <rect class="e3" x="54" y="188" width="4" height="12" rx="2" fill="#ffffff"/>
    <rect class="e4" x="61" y="178" width="4" height="22" rx="2" fill="#ff1e42"/>
    <rect class="e5" x="68" y="186" width="4" height="14" rx="2" fill="#ff3366"/>

    <!-- Slanted Tag 1: Build & Ship Safe -->
    <polygon points="86,176 230,176 220,204 76,204" fill="#0e1526" stroke="#00ff9d" stroke-width="1.2"/>
    <text class="pill-text" x="153" y="194" text-anchor="middle">🛡️ BUILD &amp; SHIP SAFE</text>

    <!-- Slanted Tag 2: Indonesia (Merah Putih Accent) -->
    <polygon points="240,176 395,176 385,204 230,204" fill="#140a12" stroke="#ff1e42" stroke-width="1.2"/>
    <text class="pill-text" x="312" y="194" text-anchor="middle">🇮🇩 WEST JAVA, ID</text>

    <!-- ================= RIGHT: CLEAN MACOS TERMINAL WINDOW ================= -->
    <g class="term-float">
      <!-- Shadow & Body -->
      <rect x="502" y="24" width="368" height="182" rx="10" fill="#03060a" opacity="0.6"/>
      <rect x="496" y="18" width="368" height="182" rx="10" fill="#0a0f1b" stroke="#1e293b" stroke-width="1.4"/>

      <!-- Window Top Bar -->
      <path d="M 496,28 Q 496,18 506,18 L 854,18 Q 864,18 864,28 L 864,46 L 496,46 Z" fill="#111827"/>
      <circle cx="514" cy="32" r="5" fill="#ef4444"/>
      <circle cx="530" cy="32" r="5" fill="#f59e0b"/>
      <circle cx="546" cy="32" r="5" fill="#10b981"/>
      <text x="675" y="35" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">rezza@secops-node: ~/pipeline</text>

      <!-- Status Pill -->
      <rect x="786" y="24" width="68" height="16" rx="8" fill="#052e16" stroke="#00ff9d" stroke-width="1"/>
      <circle cx="796" cy="32" r="3" fill="#00ff9d"/>
      <text x="826" y="35" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8.5" font-weight="bold" fill="#86efac">HEALTHY</text>

      <!-- Scanning Beam -->
      <line class="beam-line" x1="498" y1="46" x2="862" y2="46" stroke="#00f2fe" stroke-width="1.2"/>

      <!-- Terminal Output -->
      <g transform="translate(512, 68)">
        <text class="t-prm" x="0" y="0">┌──(rezza㉿devsecops)-[~]</text>
        <text class="t-prm" x="0" y="18">└─$ <tspan class="t-white">./deploy_verified_stack.sh</tspan></text>

        <text class="t-txt" x="0" y="40">
          <tspan class="t-cyan">[✓] SAST Scan:</tspan> <tspan class="t-green">SonarQube Passed (0 Vuln)</tspan>
        </text>
        <text class="t-txt" x="0" y="58">
          <tspan class="t-cyan">[✓] Container:</tspan> <tspan class="t-white">Docker + Trivy Clean</tspan>
        </text>
        <text class="t-txt" x="0" y="76">
          <tspan class="t-cyan">[✓] K8s Deploy:</tspan> <tspan class="t-green">Pods Running in Prod 🚀</tspan>
        </text>
        <text class="t-txt" x="0" y="94">
          <tspan class="t-red">[★] Security:</tspan> <tspan class="t-white">OWASP Verified &amp; Shielded</tspan>
        </text>

        <text class="t-prm" x="0" y="116">└─$ <tspan fill="#f8fafc">status</tspan> → <tspan fill="#00ff9d">"Ship fast, stay secure"</tspan></text>
        <rect class="term-cursor" x="254" y="105" width="7" height="13" fill="#00ff9d"/>
      </g>
    </g>
  </g>

  <!-- Glowing Accent Wave Border -->
  <path d="M 0,248 C 140,208 290,276 450,238 C 620,200 760,268 900,230" fill="none" stroke="url(#accentBorder)" stroke-width="3"/>
</svg>
