<svg width="900" height="290" viewBox="0 0 900 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Custom Cyber Wave Clip -->
    <clipPath id="cyberWave">
      <path d="M 0,24 Q 0,0 24,0 L 876,0 Q 900,0 900,24 L 900,235 C 760,275 620,205 450,245 C 290,285 140,215 0,255 Z"/>
    </clipPath>

    <!-- Deep Cyber Matrix Background Gradient -->
    <linearGradient id="bgCyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d"/>
      <stop offset="45%" stop-color="#080e1c"/>
      <stop offset="80%" stop-color="#0c071e"/>
      <stop offset="100%" stop-color="#030810"/>
    </linearGradient>

    <!-- Neon Cyber Green & Cyan Name Gradient -->
    <linearGradient id="cyberNameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="85%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Liquid Cyber Waves -->
    <linearGradient id="cyberWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cyberWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00ff9d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="cyberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Radar / Shield Glow Filter -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatTerm {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes rotateRadar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseTerminal {
        0%, 100% { stroke-opacity: 0.5; filter: drop-shadow(0 0 4px #00ff9d44); }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 10px #00ff9d88); }
      }
      @keyframes blinkTermCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanbeam {
        0% { transform: translateY(-10px); opacity: 0; }
        20% { opacity: 0.35; }
        80% { opacity: 0.35; }
        100% { transform: translateY(180px); opacity: 0; }
      }
      @keyframes cyberEq1 { 0%, 100% { height: 9px; y: 198px; } 50% { height: 24px; y: 183px; } }
      @keyframes cyberEq2 { 0%, 100% { height: 22px; y: 185px; } 50% { height: 8px; y: 199px; } }
      @keyframes cyberEq3 { 0%, 100% { height: 14px; y: 193px; } 50% { height: 26px; y: 181px; } }
      @keyframes cyberEq4 { 0%, 100% { height: 26px; y: 181px; } 50% { height: 11px; y: 196px; } }
      @keyframes cyberEq5 { 0%, 100% { height: 12px; y: 195px; } 50% { height: 22px; y: 185px; } }
      @keyframes meteorTrail {
        0% { transform: translate(0, 0); opacity: 0; }
        15% { opacity: 0.9; }
        60% { transform: translate(-260px, 130px); opacity: 0; }
        100% { transform: translate(-260px, 130px); opacity: 0; }
      }

      .term-box { animation: floatTerm 4.5s ease-in-out infinite; }
      .radar-spin { transform-origin: 64px 64px; animation: rotateRadar 12s linear infinite; }
      .radar-reverse { transform-origin: 64px 64px; animation: rotateRadar 20s linear infinite reverse; }
      .term-cursor { animation: blinkTermCursor 0.9s infinite; }
      .scanline { animation: scanbeam 4s ease-in-out infinite; }
      .eq-c1 { animation: cyberEq1 1.1s ease-in-out infinite; }
      .eq-c2 { animation: cyberEq2 0.8s ease-in-out infinite; }
      .eq-c3 { animation: cyberEq3 1.3s ease-in-out infinite; }
      .eq-c4 { animation: cyberEq4 1.0s ease-in-out infinite; }
      .eq-c5 { animation: cyberEq5 1.2s ease-in-out infinite; }
      .m-trail1 { animation: meteorTrail 4.5s linear infinite; }
      .m-trail2 { animation: meteorTrail 6.5s linear infinite 2s; }

      .greet-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11px; font-weight: 700; fill: #00ff9d; letter-spacing: 2px; }
      .hero-name { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; font-size: 38px; font-weight: 900; fill: url(#cyberNameGrad); filter: drop-shadow(0 2px 8px rgba(0,255,157,0.3)); }
      .hero-roles { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #e2e8f0; }
      .badge-txt { font-family: 'Fira Code', monospace; font-size: 10.5px; font-weight: 700; fill: #f8fafc; }
      .t-prompt { font-family: 'Fira Code', monospace; font-size: 11px; fill: #00ff9d; }
      .t-cmd { font-family: 'Fira Code', monospace; font-size: 11px; fill: #f8fafc; font-weight: bold; }
      .t-out { font-family: 'Fira Code', monospace; font-size: 11px; fill: #94a3b8; }
      .t-accent { fill: #38bdf8; }
      .t-success { fill: #4ade80; }
      .t-warn { fill: #facc15; }
    </style>
  </defs>

  <!-- Main Body with Cyber Wave Clip -->
  <g clip-path="url(#cyberWave)">
    <rect width="900" height="290" fill="url(#bgCyber)"/>

    <!-- Subtle Cyber Matrix Grid Background -->
    <g opacity="0.07" stroke="#00ff9d" stroke-width="1">
      <line x1="0" y1="40" x2="900" y2="40"/>
      <line x1="0" y1="80" x2="900" y2="80"/>
      <line x1="0" y1="120" x2="900" y2="120"/>
      <line x1="0" y1="160" x2="900" y2="160"/>
      <line x1="0" y1="200" x2="900" y2="200"/>
      <line x1="100" y1="0" x2="100" y2="290"/>
      <line x1="200" y1="0" x2="200" y2="290"/>
      <line x1="300" y1="0" x2="300" y2="290"/>
      <line x1="400" y1="0" x2="400" y2="290"/>
      <line x1="500" y1="0" x2="500" y2="290"/>
      <line x1="600" y1="0" x2="600" y2="290"/>
      <line x1="700" y1="0" x2="700" y2="290"/>
      <line x1="800" y1="0" x2="800" y2="290"/>
    </g>

    <!-- Ambient Glowing Orbs -->
    <circle cx="120" cy="90" r="150" fill="#00ff9d" opacity="0.09" filter="url(#glowGreen)"/>
    <circle cx="700" cy="120" r="180" fill="#7000ff" opacity="0.14"/>
    <circle cx="430" cy="230" r="130" fill="#00f2fe" opacity="0.08"/>

    <!-- Cyber Meteors -->
    <line class="m-trail1" x1="460" y1="10" x2="510" y2="-12" stroke="#00ff9d" stroke-width="2" stroke-linecap="round"/>
    <line class="m-trail2" x1="800" y1="20" x2="850" y2="-2" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Flowing Cyber Waves at Bottom -->
    <g opacity="0.9">
      <path d="M -900,215 Q -675,180 -450,215 T 0,215 T 450,215 T 900,215 T 1350,215 L 1350,290 L -900,290 Z" fill="url(#cyberWave1)">
        <animateTransform attributeName="transform" type="translate" from="0,0" to="900,0" dur="10s" repeatCount="indefinite"/>
      </path>
      <path d="M -900,228 Q -675,260 -450,228 T 0,228 T 450,228 T 900,228 T 1350,228 L 1350,290 L -900,290 Z" fill="url(#cyberWave2)">
        <animateTransform attributeName="transform" type="translate" from="900,0" to="0,0" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ================= LEFT SIDE: CYBER HERO IDENTITY ================= -->
    <!-- Rotating Cyber Shield / Radar Reticle -->
    <g class="radar-spin">
      <circle cx="64" cy="64" r="28" fill="none" stroke="#00ff9d" stroke-width="1.6" stroke-dasharray="14 8 4 8" opacity="0.8"/>
      <circle cx="64" cy="64" r="20" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>
    </g>
    <g class="radar-reverse">
      <polygon points="64,40 85,52 85,76 64,88 43,76 43,52" fill="none" stroke="#7000ff" stroke-width="1.4" stroke-dasharray="8 6"/>
    </g>
    <!-- Center Shield Emblem -->
    <circle cx="64" cy="64" r="16" fill="#090d18" stroke="#00ff9d" stroke-width="1.8"/>
    <!-- Cyber Lock / Shield Icon Path -->
    <path d="M 64,54 L 71,57 L 71,65 C 71,70 67,73 64,74 C 61,73 57,70 57,65 L 57,57 Z" fill="#00ff9d" opacity="0.9"/>
    <circle cx="64" cy="63" r="2" fill="#060913"/>

    <!-- Greeting Tag & Target Lock -->
    <text class="greet-text" x="106" y="58">⚡ SECURE SYSTEM // ACTIVE</text>
    <rect x="106" y="66" width="130" height="2.5" rx="1.2" fill="url(#cyberAccent)"/>

    <!-- Left-Aligned Giant Cyber Name -->
    <text class="hero-name" x="38" y="124">Rezza Fairus Nugraha</text>

    <!-- Roles & Specialization Subtitle -->
    <text class="hero-roles" x="40" y="152">
      <tspan fill="#00ff9d">Fullstack Developer</tspan>
      <tspan fill="#64748b"> • </tspan>
      <tspan fill="#00f2fe">DevSecOps Engineer</tspan>
      <tspan fill="#64748b"> • </tspan>
      <tspan fill="#c084fc">Cybersecurity Enthusiast</tspan>
    </text>

    <!-- Animated Cyber Equalizer Bars -->
    <rect class="eq-c1" x="40" y="198" width="4" height="9" rx="2" fill="#00ff9d"/>
    <rect class="eq-c2" x="47" y="185" width="4" height="22" rx="2" fill="#00f2fe"/>
    <rect class="eq-c3" x="54" y="193" width="4" height="14" rx="2" fill="#38bdf8"/>
    <rect class="eq-c4" x="61" y="181" width="4" height="26" rx="2" fill="#a855f7"/>
    <rect class="eq-c5" x="68" y="195" width="4" height="12" rx="2" fill="#ec4899"/>

    <!-- Slanted Cyber Badge 1: Build & Ship Safe -->
    <polygon points="86,180 230,180 220,208 76,208" fill="#0c1322" stroke="#00ff9d" stroke-width="1.2"/>
    <text class="badge-txt" x="153" y="198" text-anchor="middle">🛡️ SHIFT-LEFT SEC</text>

    <!-- Slanted Cyber Badge 2: Location -->
    <polygon points="240,180 395,180 385,208 230,208" fill="#0c1322" stroke="#00f2fe" stroke-width="1.2"/>
    <text class="badge-txt" x="312" y="198" text-anchor="middle">🇮🇩 WEST JAVA, ID</text>

    <!-- ================= RIGHT SIDE: KALI DEVOPS TERMINAL ================= -->
    <g class="term-box">
      <!-- Terminal Glow & Body -->
      <rect x="496" y="24" width="374" height="186" rx="10" fill="#020408" opacity="0.6"/>
      <rect x="490" y="18" width="374" height="186" rx="10" fill="#080c16" stroke="#1e293b" stroke-width="1.4" style="animation: pulseTerminal 4s infinite ease-in-out;"/>

      <!-- Terminal Top Bar -->
      <path d="M 490,28 Q 490,18 500,18 L 854,18 Q 864,18 864,28 L 864,46 L 490,46 Z" fill="#0f172a"/>
      <!-- Window Controls -->
      <circle cx="508" cy="32" r="5" fill="#f43f5e"/>
      <circle cx="524" cy="32" r="5" fill="#eab308"/>
      <circle cx="540" cy="32" r="5" fill="#10b981"/>
      <text x="670" y="35" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">rezza@secops-node: ~/pipeline</text>

      <!-- Active Defense Badge in Terminal -->
      <rect x="786" y="24" width="68" height="16" rx="8" fill="#052e16" stroke="#00ff9d" stroke-width="1"/>
      <circle cx="796" cy="32" r="3" fill="#00ff9d"/>
      <text x="826" y="35" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8.5" font-weight="bold" fill="#86efac">PROTECTED</text>

      <!-- Terminal Scanning Beam -->
      <line class="scanline" x1="492" y1="46" x2="862" y2="46" stroke="#00ff9d" stroke-width="1.2" opacity="0.3"/>

      <!-- Terminal Content -->
      <g transform="translate(506, 68)">
        <!-- Command 1 -->
        <text class="t-prompt" x="0" y="0">┌──(rezza㉿secops)-[~]</text>
        <text class="t-prompt" x="0" y="18">└─$ <tspan class="t-cmd">./run-security-pipeline.sh</tspan></text>

        <!-- Command Output -->
        <text class="t-out" x="0" y="40">
          <tspan class="t-accent">[+] SAST (SonarQube):</tspan> <tspan class="t-success">Passed (0 High/Crit)</tspan>
        </text>
        <text class="t-out" x="0" y="58">
          <tspan class="t-accent">[+] Dependency (Snyk):</tspan> <tspan class="t-success">Audited &amp; Patched</tspan>
        </text>
        <text class="t-out" x="0" y="76">
          <tspan class="t-accent">[+] Container (Trivy):</tspan> <tspan class="t-success">Hardened Image ✅</tspan>
        </text>
        <text class="t-out" x="0" y="94">
          <tspan class="t-accent">[+] Deploy (K8s):</tspan> <tspan class="t-warn">Pods Healthy &amp; Ready 🚀</tspan>
        </text>

        <text class="t-prompt" x="0" y="116">└─$ <tspan fill="#e2e8f0">echo $STATUS</tspan></text>
        <text class="t-out" x="110" y="116"><tspan fill="#00ff9d">"Build Fast, Ship Safe"</tspan></text>
        <rect class="term-cursor" x="256" y="105" width="7" height="13" fill="#00ff9d"/>
      </g>
    </g>
  </g>

  <!-- Glowing Neon Bottom Border Wave -->
  <path d="M 0,255 C 140,215 290,285 450,245 C 620,205 760,275 900,235" fill="none" stroke="url(#cyberAccent)" stroke-width="3.5" filter="url(#glowGreen)"/>
</svg>
