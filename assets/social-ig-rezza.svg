<svg width="205" height="74" viewBox="0 0 205 74" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes glowPulseWhite { 0%, 100% { stroke-opacity: 0.45; filter: drop-shadow(0 0 2px #ffffff44); } 50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #ffffff88); } }
      @keyframes badgeFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
      .card-bg { fill: #0d070b; stroke: #ffffff; stroke-width: 1.5; rx: 12px; animation: glowPulseWhite 3s infinite ease-in-out; }
      .icon-wrap { animation: badgeFloat 2.4s infinite ease-in-out; }
      .plat { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; fill: #ffffff; letter-spacing: 1px; }
      .hand { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: bold; fill: #ffffff; }
      .sub { font-family: 'Fira Code', monospace; font-size: 9.5px; fill: #cbd5e1; }
    </style>
    <linearGradient id="igRedGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e42"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect class="card-bg" x="2" y="2" width="201" height="70" rx="12"/>
  <g class="icon-wrap">
    <rect x="14" y="15" width="44" height="44" rx="11" fill="url(#igRedGrad)"/>
    <rect x="22" y="23" width="28" height="28" rx="7" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <circle cx="36" cy="37" r="6.5" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <circle cx="44.5" cy="28.5" r="1.8" fill="#ffffff"/>
  </g>
  <text class="plat" x="68" y="26">INSTAGRAM</text>
  <text class="hand" x="68" y="44">@rexzgraphic_</text>
  <text class="sub" x="68" y="59">Follow &amp; DM →</text>
</svg>
