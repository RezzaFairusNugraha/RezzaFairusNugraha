<svg width="880" height="215" viewBox="0 0 880 215" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes floatCard { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3.5px); } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes glowEdge { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 0.9; } }

      .card-wrap { animation: floatCard 4.5s ease-in-out infinite; }
      .cursor { animation: cursorBlink 0.9s infinite; }
      .border-glow { stroke: #00ff9d; animation: glowEdge 3s infinite ease-in-out; }

      .tx-comm { font-family: 'Fira Code', monospace; font-size: 11px; fill: #64748b; font-style: italic; }
      .tx-num { font-family: 'Fira Code', monospace; font-size: 11px; fill: #475569; }
      .tx-code { font-family: 'Fira Code', monospace; font-size: 11.5px; fill: #e2e8f0; }
      .k-kw { fill: #ff3366; font-weight: bold; }
      .k-var { fill: #00f2fe; }
      .k-prop { fill: #93c5fd; }
      .k-str { fill: #00ff9d; }
      .k-arr { fill: #fde047; }
    </style>
  </defs>

  <g class="card-wrap">
    <!-- Card Body -->
    <rect x="4" y="4" width="872" height="205" rx="12" fill="#080c16" stroke="#1e293b" stroke-width="1.4"/>
    <rect x="4" y="4" width="872" height="205" rx="12" fill="none" class="border-glow" stroke-width="1.2"/>

    <!-- Window Title Bar -->
    <path d="M 4,16 Q 4,4 16,4 L 864,4 Q 876,4 876,16 L 876,36 L 4,36 Z" fill="#0e1526"/>
    <circle cx="22" cy="20" r="5" fill="#ef4444"/>
    <circle cx="38" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="20" r="5" fill="#10b981"/>

    <text x="440" y="24" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">rezza-profile.ts — Visual Studio Code</text>

    <!-- Corner Pill: Merah Putih & Active -->
    <rect x="760" y="11" width="98" height="18" rx="9" fill="#1e101a" stroke="#ff1e42" stroke-width="1"/>
    <circle cx="772" cy="20" r="3.5" fill="#ff1e42"/>
    <text x="814" y="23.5" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#ffffff">ID • DEVSECOPS</text>

    <!-- Code Content -->
    <!-- Line 1: Comment -->
    <text class="tx-num" x="20" y="60">1</text>
    <text class="tx-comm" x="44" y="60">// Fullstack Developer &amp; Security Engineer • West Java, Indonesia 🇮🇩</text>

    <!-- Line 2: const engineer = { -->
    <text class="tx-num" x="20" y="80">2</text>
    <text class="tx-code" x="44" y="80">
      <tspan class="k-kw">export const</tspan> <tspan class="k-var">rezza</tspan> = {
    </text>

    <!-- Line 3: mindset -->
    <text class="tx-num" x="20" y="100">3</text>
    <text class="tx-code" x="64" y="100">
      <tspan class="k-prop">mission:</tspan> <tspan class="k-str">"Bridging rapid fullstack development &amp; bulletproof software security."</tspan>,
    </text>

    <!-- Line 4: conviction -->
    <text class="tx-num" x="20" y="120">4</text>
    <text class="tx-code" x="64" y="120">
      <tspan class="k-prop">philosophy:</tspan> <tspan class="k-str">"Security is never a blocker or afterthought — it is a core engineering requirement."</tspan>,
    </text>

    <!-- Line 5: focus -->
    <text class="tx-num" x="20" y="140">5</text>
    <text class="tx-code" x="64" y="140">
      <tspan class="k-prop">focusAreas:</tspan> [<tspan class="k-arr">"Cloud Backends &amp; React/Next.js"</tspan>, <tspan class="k-arr">"CI/CD SAST/DAST &amp; Trivy"</tspan>, <tspan class="k-arr">"Ethical Hacking &amp; CTFs"</tspan>],
    </text>

    <!-- Line 6: goal -->
    <text class="tx-num" x="20" y="160">6</text>
    <text class="tx-code" x="64" y="160">
      <tspan class="k-prop">directive:</tspan> <tspan class="k-str">"Continuous improvement, resilient engineering, and shipping safe code 🚀"</tspan>,
    </text>

    <!-- Line 7: }; -->
    <text class="tx-num" x="20" y="180">7</text>
    <text class="tx-code" x="44" y="180">};</text>
    <rect class="cursor" x="66" y="169" width="7" height="13" fill="#00ff9d"/>
  </g>
</svg>
