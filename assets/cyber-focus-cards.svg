<svg width="860" height="150" viewBox="0 0 860 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes borderGlow1 { 0%, 100% { stroke-opacity: 0.4; filter: drop-shadow(0 0 2px #00ff9d44); } 50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px #00ff9d99); } }
      @keyframes borderGlow2 { 0%, 100% { stroke-opacity: 0.4; filter: drop-shadow(0 0 2px #00f2fe44); } 50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px #00f2fe99); } }
      @keyframes borderGlow3 { 0%, 100% { stroke-opacity: 0.4; filter: drop-shadow(0 0 2px #a855f744); } 50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px #a855f799); } }
      @keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.3); opacity: 1; } }

      .card-bg { fill: #070b14; rx: 12px; stroke-width: 1.5; }
      .c1 { stroke: #00ff9d; animation: borderGlow1 3.2s infinite ease-in-out; }
      .c2 { stroke: #00f2fe; animation: borderGlow2 3.6s infinite ease-in-out; }
      .c3 { stroke: #a855f7; animation: borderGlow3 4.0s infinite ease-in-out; }

      .tag { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; letter-spacing: 1px; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14.5px; font-weight: bold; fill: #f8fafc; }
      .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #94a3b8; }
      .dot { transform-origin: 24px 26px; animation: pulseDot 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- CARD 1: FULLSTACK -->
  <g transform="translate(8, 8)">
    <rect class="card-bg c1" width="272" height="134"/>
    <circle class="dot" cx="24" cy="26" r="5" fill="#00ff9d"/>
    <text class="tag" x="38" y="30" fill="#00ff9d">01 // FULLSTACK DEVELOPMENT</text>
    <text class="title" x="20" y="58">Modern Web &amp; Scalable Apps</text>
    <text class="desc" x="20" y="80">End-to-end architectures crafted with</text>
    <text class="desc" x="20" y="98">React, Next.js, Node.js, TypeScript,</text>
    <text class="desc" x="20" y="116">PostgreSQL &amp; RESTful API design.</text>
  </g>

  <!-- CARD 2: DEVSECOPS -->
  <g transform="translate(294, 8)">
    <rect class="card-bg c2" width="272" height="134"/>
    <circle class="dot" cx="24" cy="26" r="5" fill="#00f2fe"/>
    <text class="tag" x="38" y="30" fill="#00f2fe">02 // DEVSECOPS &amp; CLOUD</text>
    <text class="title" x="20" y="58">Shift-Left CI/CD Pipelines</text>
    <text class="desc" x="20" y="80">Automating Docker, Kubernetes,</text>
    <text class="desc" x="20" y="98">SonarQube (SAST), Snyk &amp; Trivy</text>
    <text class="desc" x="20" y="116">container vulnerability scanning.</text>
  </g>

  <!-- CARD 3: CYBERSECURITY -->
  <g transform="translate(580, 8)">
    <rect class="card-bg c3" width="272" height="134"/>
    <circle class="dot" cx="24" cy="26" r="5" fill="#a855f7"/>
    <text class="tag" x="38" y="30" fill="#c084fc">03 // CYBERSECURITY &amp; PENTEST</text>
    <text class="title" x="20" y="58">Offensive &amp; Defensive Sec</text>
    <text class="desc" x="20" y="80">Web pentesting, OWASP Top 10,</text>
    <text class="desc" x="20" y="98">Burp Suite, CTFs &amp; securing Linux</text>
    <text class="desc" x="20" y="116">production environments.</text>
  </g>
</svg>
