<svg width="205" height="74" viewBox="0 0 205 74" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes glowPulse { 0%, 100% { stroke-opacity: 0.45; filter: drop-shadow(0 0 2px #ea433544); } 50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #ea433588); } }
      @keyframes badgeFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
      .card-bg { fill: #070c18; stroke: #ea4335; stroke-width: 1.5; rx: 12px; animation: glowPulse 3s infinite ease-in-out; }
      .icon-wrap { animation: badgeFloat 2.4s infinite ease-in-out; }
      .plat { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; fill: #ea4335; letter-spacing: 1px; }
      .hand { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: bold; fill: #ffffff; }
      .sub { font-family: 'Fira Code', monospace; font-size: 9.5px; fill: #94a3b8; }
    </style>
  </defs>
  <rect class="card-bg" x="2" y="2" width="201" height="70" rx="12"/>
  <g class="icon-wrap">
    <rect x="14" y="15" width="44" height="44" rx="11" fill="#ea4335"/>
    <rect x="21" y="25" width="30" height="24" rx="3" fill="none" stroke="#ffffff" stroke-width="2.3"/>
    <path d="M22 27 L36 38 L50 27" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="plat" x="68" y="26">EMAIL</text>
  <text class="hand" x="68" y="44">rezzafairus</text>
  <text class="sub" x="68" y="59">Direct message →</text>
</svg>
